<!DOCTYPE html>

<head>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body>
  <div id="app">
    <!-- Navigation -->
    <nav class="nav" id="main-nav">

          <a href="#/agent" class="nav__link nav__link--accent" data-page="agent-chat" id="nav-agent">

          </a>
          <a href="#/leaderboard" class="nav__link" data-page="leaderboard" id="nav-leaderboard">Leaderboard</a>
        </div>
        <div class="nav__actions">
          <button class="btn btn--glass btn--sm" id="wallet-btn" aria-label="Connect wallet">

            <span id="wallet-label">Connect Wallet</span>

          <a href="#/profile" class="nav__avatar" id="nav-profile" title="Profile" style="display:none;">

    <!-- Mobile Menu Overlay -->
    <div class="mobile-menu" id="mobile-menu">
      <div class="mobile-menu__inner">
        <a href="#/" class="mobile-menu__link" data-page="landing">Home</a>

      </div>
    </div>

    <!-- Main Content -->
    <main class="main" id="main-content" role="main">
      <!-- Pages injected here by router -->
    </main>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container" aria-live="polite"></div>

    <!-- Modals Container -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal" id="modal-content"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
